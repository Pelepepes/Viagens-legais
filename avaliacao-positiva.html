<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliacao Positiva - Galinha Viagens</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: url('positivas.png.png') no-repeat center center;
            background-size: 100% 100%;
            position: relative;
        }
        .campo-nota {
            position: absolute;
            top: 92px;
            left: 265px;
            width: 67px;
            height: 22px;
            background: transparent;
            border: none;
            font-size: 16px;
            padding: 2px;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <input type="number" class="campo-nota" min="1" max="5" placeholder="1-5">
</body>
</html>
